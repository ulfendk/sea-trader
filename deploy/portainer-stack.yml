# Sea Trader stack for Portainer (Stacks → Add stack → Web editor, or Repository → deploy/portainer-stack.yml).
# Set the variables under "Environment variables" in Portainer; at minimum ADMIN_PASSWORD,
# POSTGRES_PASSWORD and PUBLIC_URL. See docs/deployment.md.
services:
  app:
    image: ${SEA_TRADER_IMAGE:-ghcr.io/ulfendk/sea-trader:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Remove this mapping if your reverse proxy joins the stack network instead.
      - '${APP_PORT:-2567}:2567'
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-seatrader}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-seatrader}
      PUBLIC_URL: ${PUBLIC_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      # Free key from https://www.eia.gov/opendata/ for real Brent fuel prices (optional).
      EIA_API_KEY: ${EIA_API_KEY:-}
      FEEDS_ENABLED: ${FEEDS_ENABLED:-true}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      OPEN_REGISTRATION: ${OPEN_REGISTRATION:-false}
      SERVE_WEB: ${SERVE_WEB:-true}
      TICK_MS: ${TICK_MS:-5000}

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seatrader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-seatrader}
    volumes:
      - sea-trader-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sea-trader-db:
