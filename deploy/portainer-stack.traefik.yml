# Variant of portainer-stack.yml for hosts running Traefik (v2/v3) on an external network.
# Set SEA_TRADER_HOST (e.g. seatrader.example.com) and TRAEFIK_NETWORK (default: traefik).
services:
  app:
    image: ${SEA_TRADER_IMAGE:-ghcr.io/ulfendk/sea-trader:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-seatrader}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-seatrader}
      PUBLIC_URL: https://${SEA_TRADER_HOST}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TRUST_PROXY: '1'
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    networks: [default, proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.seatrader.rule=Host(`${SEA_TRADER_HOST}`)
      - traefik.http.routers.seatrader.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.seatrader.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}
      - traefik.http.services.seatrader.loadbalancer.server.port=2567

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seatrader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-seatrader}
    volumes:
      - sea-trader-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

networks:
  proxy:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true

volumes:
  sea-trader-db:
